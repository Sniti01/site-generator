site:
  name: "7thserpent.com"
  domain: "7thserpent.com"    # канонический адрес — https://www.7thserpent.com (П62 п. 4)
  lang: "en"
  geo: "США"
  niche: "фан сайт, посвящённый игре Max Payne"
  goal: "чтение, смотреть видео, искать нужную ему информацию"
  tone: "игровой"

mode: normal

# ─── СТРУКТУРА ────────────────────────────────────────────────
structure:
  source: clusters
  input: "input/Clustering_max-payne_with_volume.xlsx"   # П62 п. 5: файл окончательный
  texts: false             # тексты производятся по способу первого сайта или иначе — П42 заново, к пачке 0
  depth: 2                 # = MAX_DEPTH контракта core/structure/schema.json
  page_types: []           # закрытый список контракта (home, hub, game, guide, topic, map, legal) — выводится деревом S2

# ─── РЕФЕРЕНСЫ ────────────────────────────────────────────────
