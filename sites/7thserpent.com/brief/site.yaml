# ─── ДОПОЛНИТЕЛЬНОЕ ТЗ ────────────────────────────────────────
extra: |
  Неофициальный фан-сайт: дисклеймер в подвале, без идентики издателя
  (PRODUCT.md «Юридическое ограничение фан-сайтов»). Класс лицензии
  на кадры издателя и источники арта — «да» владельца к пачке 0.

  Цель «смотреть видео»: в каталоге блоков ядра (core/structure/blocks.json)
  видео-блока нет; имя блока — решение владельца после анатомии S3
  (прецедент П28). YouTube — второй хост выдачи семантики.

  Семантика: один лист Clustering, 9 колонок, 508 фраз, 103 группы
  (колонка «Название группы»); объём — колонка «Частотность», источник
  и гео не названы (гипотеза — Ahrefs US); сводного листа «Кластеры»,
  листов «Не сопоставлено»/«Легенда» и раскола WS/Google нет — читалка
  ядра получает второй формат в сессии 4 (П62 п. 5).

  Аналитика — нет по умолчанию (П42); иначе — сказать до пачки 0.
