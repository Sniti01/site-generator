# Выкладка 7thserpent.com на хостинг — GitHub Actions → FTPS (П106; форма deploy-ac4bf.yml, П54 п. 4
# и его дополнение; «судью судят», раунды 1–3 — сторожа и порядок шагов).
#
# ПРОТОКОЛ — FTPS (FTP с явным шифрованием TLS, порт 21), как у первого сайта: хостер тот же (П52 п. 1),
# отдельный сайт 7thserpent.com в панели. Робот — отдельный пользователь FTP («Користувачі FTP») с «Каталогом
# доступу» 7thserpent.com/www: SSH/SFTP у этого хостера — доступ основного аккаунта, который видит все сайты
# аккаунта. Шифрование команд и данных принудительное (`ftp:ssl-force`, `ssl-protect-data`), сертификат
# проверяется — незашифрованного соединения не будет. Пароль в строку команды lftp не идёт: `open --env-password`
# берёт его из переменной LFTP_PASSWORD (кавычка или «;» в пароле команду не ломают и в журнал не попадают).
# Файлы пишутся через временное имя (`xfer:use-temp-file`): оборванная выкладка не оставляет обрубок под
# настоящим именем.
#
# Когда работает:
#   • руками: Actions → «Deploy 7thserpent.com» → Run workflow — всегда; вход SERPENT_FIRST = `on` — первая
#     выкладка. Первой считается и выкладка, у которой на сервере нет нашего index.html (вход по умолчанию её
#     не отменяет): домен обязан не отвечать — или вход SERPENT_DOMAIN_BOUND = `on` (владелец согласен, что домен
#     уже привязан: сторож домена печатает, что тот отвечает, и не останавливает, П108); сборка CI обязана равняться
#     принятой (gates/sborka-prinyataya.json);
#   • после push в `main` — ТОЛЬКО если переменная репозитория SERPENT_DEPLOY равна `on` (Settings → Secrets
#     and variables → Actions → Variables). Предохранитель П52 п. 3: ящик → привязка домена → проверка https
#     → Search Console; пока переменной нет, push в main ничего не выкладывает. Проверка живого сайта после
#     выкладки — только при SERPENT_LIVE = `on`. Обе переменные — только после зелёного `npm run live:check`.
#
# Секреты (Settings → Secrets and variables → Actions → Secrets); лист владельца —
# docs/reports/2026-09-29-7thserpent-yashchik/ruki-vladelca.md (прежний — …/2026-09-28-7thserpent-publikacija/):
#   SERPENT_FTP_HOST      хост FTP из панели
#   SERPENT_FTP_PORT      порт (21)
#   SERPENT_FTP_USER      логин пользователя FTP робота второго сайта
#   SERPENT_FTP_PASSWORD  его пароль
#   SERPENT_CORPUS_KEY    закрытый ключ развёртывания (deploy key, только чтение) приватного репозитория корпуса
#   AC4BF_FTP_USER        секрет первого сайта — читается только для сверки «робот не тот же», не печатается
# Каталога на сервере в секретах НЕТ намеренно: выкладка идёт в корень того, что видит робот, а сторож
# папки пропускает только пустой корень, свежий каталог хостера или прежнюю нашу выкладку — `mirror --delete`
# стирает всё, чего нет в dist/.
#
# КОРПУС (П106 — отступление от «сырой HTML в git не идёт» словом владельца: только приватный репозиторий,
# только для сборки). Сторож 8 слов в сборке без input/corpus/raw отказывает громко (П102), выключателей
# нет. На CI сырьё приходит из приватного репозитория Sniti01/7thserpent-corpus (его корень — содержимое
# input/corpus/raw как есть) ключом только для чтения. В журнал и на сервер сырьё не попадает: checkout
# имён файлов не печатает, сторож 8 слов печатает только наши страницы, на сервер едет только dist/.
#
# Что делает: checkout → сторож секретов → корпус → npm ci → сборка сайта с гейтами и сторожами (TZ
# Europe/Warsaw — день подписи byline, П92 п. 5) → lftp → сторож папки робота и удалённого index.html →
# глубина (find . после суда корня) → первая ли выкладка → «домен уже привязан?» (бэклог 46 п. 2; при первой
# выкладке и входе SERPENT_DOMAIN_BOUND = on — строка ответа домена, без стопа, П108) → при
# первой: сборка CI = принятая (sha256 после нормализации cid ядра, SV1-Z-1) → mirror -R --delete dist/ без
# главной, затем главная → пересчёт файлов на сервере против dist/ → live:check (SERPENT_LIVE). Красный
# гейт, сторож сборки или сторож выкладки останавливает прогон до
# того, как тронут сервер. Сторожа — `node tools/storozha-vykladki.mjs` сайта (пробы —
# tools/testy/storozha-vykladki.test.mjs); циклов оболочки нет.
#
# Сторонних actions нет: lftp из репозитория Ubuntu, checkout и setup-node — от GitHub. Журнал выкладки
# в публичном репозитории виден всем: секреты GitHub маскирует, имена файлов сайта и так публичны.

name: Deploy 7thserpent.com

on:
  workflow_dispatch:
    inputs:
      SERPENT_FIRST:
        description: 'Первая выкладка: on — домен обязан не отвечать (или SERPENT_DOMAIN_BOUND = on), сборка CI обязана равняться принятой'
        type: choice
        options: ['off', 'on']
        default: 'off'
      SERPENT_DOMAIN_BOUND:
        description: 'Домен привязан — согласен: on — при первой выкладке сторож домена печатает, что отвечает домен, и не останавливает (П108)'
        type: choice
        options: ['off', 'on']
        default: 'off'
  push:
    branches: [main]
    paths:
      - 'sites/7thserpent.com/**'
      - 'core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-7thserpent.yml'

concurrency:
  group: deploy-7thserpent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.SERPENT_DEPLOY == 'on'
    # Ubuntu закреплена: с 19 октября 2026 ubuntu-latest — Ubuntu 26, lftp из её репозитория не проверялся.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITE: sites/7thserpent.com
      TZ: Europe/Warsaw
      # Общие настройки lftp: FTPS принудительно, сертификат проверяется, пассивный режим (робот за NAT
      # GitHub), таймауты и повторы, выход при первой ошибке команды, запись через временное имя.
      LFTP_SET: >-
        set ftp:ssl-force true;
        set ftp:ssl-protect-data true;
        set ssl:verify-certificate yes;
        set ftp:passive-mode true;
        set net:timeout 30;
        set net:max-retries 3;
        set cmd:fail-exit yes;
        set xfer:use-temp-file yes;
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Секреты на месте, робот — не робот первого сайта
        env:
          SERPENT_FTP_HOST: ${{ secrets.SERPENT_FTP_HOST }}
          SERPENT_FTP_PORT: ${{ secrets.SERPENT_FTP_PORT }}
          SERPENT_FTP_USER: ${{ secrets.SERPENT_FTP_USER }}
          SERPENT_FTP_PASSWORD: ${{ secrets.SERPENT_FTP_PASSWORD }}
          SERPENT_CORPUS_KEY: ${{ secrets.SERPENT_CORPUS_KEY }}
          AC4BF_FTP_USER: ${{ secrets.AC4BF_FTP_USER }}
        run: node $SITE/tools/storozha-vykladki.mjs sekrety

      - name: Зависимости
        run: npm ci

      # Корпус — после npm ci (SV2-O-7): скрипты установки зависимостей идут без сырья на диске.
      - name: Корпус для сторожа 8 слов — приватный репозиторий, ключ только для чтения
        uses: actions/checkout@v5
        with:
          repository: Sniti01/7thserpent-corpus
          ssh-key: ${{ secrets.SERPENT_CORPUS_KEY }}
          path: sites/7thserpent.com/input/corpus/raw
          persist-credentials: false

      - name: Сборка с гейтами и сторожами
        run: npm run build -w $SITE

      - name: lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Сторож папки робота и удалённого index.html
        env:
          SERPENT_FTP_HOST: ${{ secrets.SERPENT_FTP_HOST }}
          SERPENT_FTP_PORT: ${{ secrets.SERPENT_FTP_PORT }}
          SERPENT_FTP_USER: ${{ secrets.SERPENT_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SERPENT_FTP_PASSWORD }}
        # Порядок (SV3-O-4): корень (cls) и главная с картой прежней выкладки → суд корня → find . только после него
        # (робот, который видит аккаунт, не обходит его целиком) → глубина. Ошибки find — в файл, их судит глубина.
        run: |
          lftp -e "$LFTP_SET open --env-password -u \"$SERPENT_FTP_USER\" -p \"$SERPENT_FTP_PORT\" ftp://$SERPENT_FTP_HOST; cls -1 -a -F; bye" > remote-root.txt
          lftp -e "$LFTP_SET open --env-password -u \"$SERPENT_FTP_USER\" -p \"$SERPENT_FTP_PORT\" ftp://$SERPENT_FTP_HOST; mirror --no-recursion --include-glob=index.html --include-glob=sitemap-0.xml . remote-top; bye"
          node $SITE/tools/storozha-vykladki.mjs papka remote-root.txt remote-top/index.html $SITE/dist remote-top/sitemap-0.xml
          node $SITE/tools/storozha-vykladki.mjs indeks remote-top/index.html
          lftp -e "$LFTP_SET open --env-password -u \"$SERPENT_FTP_USER\" -p \"$SERPENT_FTP_PORT\" ftp://$SERPENT_FTP_HOST; find .; bye" > remote-before.txt 2> remote-before-oshibki.txt || echo "lftp: find закончился ненулевым кодом" >> remote-before-oshibki.txt
          node $SITE/tools/storozha-vykladki.mjs glubina remote-before.txt remote-top/index.html $SITE/dist remote-top/sitemap-0.xml remote-before-oshibki.txt

      - name: Первая выкладка?
        id: pervaya
        env:
          SERPENT_FIRST: ${{ inputs.SERPENT_FIRST || 'off' }}
        run: node $SITE/tools/storozha-vykladki.mjs pervaya remote-top/index.html remote-before.txt

      - name: Домен уже привязан?
        env:
          SERPENT_PERVAYA: ${{ steps.pervaya.outputs.pervaya }}
          SERPENT_DOMAIN_BOUND: ${{ inputs.SERPENT_DOMAIN_BOUND || 'off' }}
        run: node $SITE/tools/storozha-vykladki.mjs domen

      # Пустой признак — тоже первая (SV2-O-4): сверка пропускается только при явном «off».
      - name: Первая выкладка — сборка CI равна принятой
        if: steps.pervaya.outputs.pervaya != 'off'
        run: node $SITE/tools/storozha-vykladki.mjs sverka-dist $SITE/dist $SITE/gates/sborka-prinyataya.json

      - name: Выкладка по FTPS
        env:
          SERPENT_FTP_HOST: ${{ secrets.SERPENT_FTP_HOST }}
          SERPENT_FTP_PORT: ${{ secrets.SERPENT_FTP_PORT }}
          SERPENT_FTP_USER: ${{ secrets.SERPENT_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SERPENT_FTP_PASSWORD }}
        # Служебные записи хостера (сертификат, cgi) mirror не трогает и не удаляет — папкой, ссылкой или файлом (SV2-O-2,
        # SV3-O-1, по документации lftp). Главная — последней (SV3-O-5): mirror без неё, затем put; оборванная первая
        # выкладка остаётся без нашего index.html, и повтор снова первый — со сверкой сборки.
        run: lftp -e "$LFTP_SET open --env-password -u \"$SERPENT_FTP_USER\" -p \"$SERPENT_FTP_PORT\" ftp://$SERPENT_FTP_HOST; mirror --reverse --delete --verbose --parallel=4 -X .well-known -X .well-known/ -X cgi-bin -X cgi-bin/ -x '^index\.html$' $SITE/dist/ .; put $SITE/dist/index.html -o index.html; bye"

      - name: Пересчёт на сервере
        env:
          SERPENT_FTP_HOST: ${{ secrets.SERPENT_FTP_HOST }}
          SERPENT_FTP_PORT: ${{ secrets.SERPENT_FTP_PORT }}
          SERPENT_FTP_USER: ${{ secrets.SERPENT_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SERPENT_FTP_PASSWORD }}
        run: |
          lftp -e "$LFTP_SET open --env-password -u \"$SERPENT_FTP_USER\" -p \"$SERPENT_FTP_PORT\" ftp://$SERPENT_FTP_HOST; find .; bye" > remote-files.txt
          node $SITE/tools/storozha-vykladki.mjs pereschet remote-files.txt $SITE/dist

      - name: Проверка живого сайта
        if: vars.SERPENT_LIVE == 'on'
        run: npm run live:check -w $SITE
