# Второй сайт фабрики. Ответы владельца — П62 (2026-09-18), разложены
# сессией 3 по шаблону docs/01_BRIEF_TEMPLATE.yaml. Слова владельца
# сохранены; поправлены только опечатки. Пустое поле = разрешение
# конвейеру решить самому (mode); TODO = заполняет владелец, не выдумывать.
# ─────────────────────────────────────────────────────────────

site:
  name: "7thserpent.com"
  domain: "7thserpent.com"    # канонический адрес — https://www.7thserpent.com (П62 п. 4)
  lang: "en"
  geo: "США"
  niche: "фан сайт посвящённый игре max payne"
  goal: "Чтение, смотреть видео, искать нужную ему информацию"
  tone: "игровой"

mode: normal

# ─── СТРУКТУРА ────────────────────────────────────────────────
structure:
  source: clusters
  input: "input/Clustering_max-payne_with_volume.xlsx"   # П62 п. 5: файл окончательный
  texts: false             # тексты производятся по способу первого сайта или иначе — П42 заново, к пачке 0
  depth: 2                 # = MAX_DEPTH контракта core/structure/schema.json
  page_types: []           # закрытый список контракта (home, hub, game, guide, topic, map, legal) — выводится деревом S2

# ─── РЕФЕРЕНСЫ ────────────────────────────────────────────────
references:
  global: []               # TODO — к сессии темы (7), если тема строится по референсам
  blocks: []

# ─── БЛОКИ ПО ТИПАМ СТРАНИЦ ───────────────────────────────────
blocks: {}                 # карта блоков — из умолчаний ядра (type-blocks.json) и анатомии S3

# ─── ДИЗАЙН ───────────────────────────────────────────────────
design:                    # заполнено сессией 7 по итогу (П63 п. 3, П72), дополнено сессией 9 (П79); нормативен DESIGN.md сайта
  theme: "«Зимняя ночь» — шасси первого сайта (токены, роли, конструкция) с оверрайдами палитры и гарнитур под нуар"
  palette: "холодная сине-чёрная ночь (#090c11), снег вместо белого (#e5eaee), фонарь (#eca84a) — единственный тёплый цвет и единственная заливка; сталь (#809db2) — второй акцент; красный — только опасность"
  density: "как у шасси: контейнер 1240px, ритм секций 72–128px, текст колонкой до 62ch"
  motion: "как у шасси: отклик на наведение и нажатие, плавная прокрутка к якорю; у главной одно своё движение — «пуля» трассы, которую ведёт прокрутка (сессия 9, П79); снег неподвижен; prefers-reduced-motion отключает всё"
  must_have:
    - "шрифты своими файлами (@fontsource, OFL, с табличными цифрами): Bodoni Moda 600 — заголовки, Public Sans 400/500/600 — текст и интерфейс"
    - "видео — фасадом без сторонних запросов до клика (блок video, П71 п. 3)"
    - "дисклеймер о неофициальном статусе в подвале"
    - "главная — «Трасса пули» из блоков ядра по blocks[] (П79): ключевой арт Max Payne (2001) в свете фонаря, линия трассы 2001 → 2003 → 2012 → TBA, ряды игр — страницы-панели графической новеллы со снежными плашками рассказчика"
    - "кадры — «Ночь и один фонарь»: скриншоты дуотоном стали, ключевой арт первого экрана — фонарём (дуотон ядра, новых токенов нет)"
    - "арт — материалы издателя со Steam (Rockstar Games): класс лицензии в каждой записи кредитов и строкой в подвале страницы, происхождение вшито в файл; текст поверх арта — замер пикселей"
  forbidden:
    - "логотипы, фирменные гарнитуры и точная палитра издателя (PRODUCT.md); обложки игр как оформление"
    - "внешние запросы шрифтов, видео и аналитики"
    - "красный как акцент; чистый белый на текст"
    - "кадры фильма и фото людей без решения владельца (П79)"

# ─── SEO ──────────────────────────────────────────────────────
seo:
  title_pattern: ""        # TODO
  description_pattern: ""
  schema: []
  internal_links: ""
  notes: ""

# ─── ДОПОЛНИТЕЛЬНОЕ ТЗ ────────────────────────────────────────
extra: |
  Неофициальный фан-сайт: дисклеймер в подвале, без идентики издателя
  (PRODUCT.md «Юридическое ограничение фан-сайтов»). Класс лицензии
  на кадры издателя и источники арта — «да» владельца к пачке 0.

  Цель «смотреть видео»: в каталоге блоков ядра (core/structure/blocks.json)
  видео-блока нет; имя блока — решение владельца после анатомии S3
  (прецедент П28). YouTube — второй хост выдачи семантики.

  Семантика: один лист Clustering, 9 колонок, 508 фраз, 103 группы
  (колонка «Название группы»); объём — колонка «Частотность», источник
  и гео не названы (гипотеза — Ahrefs US); сводного листа «Кластеры»,
  листов «Не сопоставлено»/«Легенда» и раскола WS/Google нет — читалка
  ядра получает второй формат в сессии 4 (П62 п. 5).

  Аналитика — нет по умолчанию (П42); иначе — сказать до пачки 0.
