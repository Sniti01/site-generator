# ─────────────────────────────────────────────────────────────
# BRIEF — единый вход для сборки сайта
# Копируется в sites/<site-name>/brief/site.yaml и заполняется.
# Пустые поля = разрешение конвейеру решить самому (см. mode).
# ─────────────────────────────────────────────────────────────

site:
  name: ""                 # рабочее имя проекта
  domain: ""               # 7dtd.com.pl
  lang: ""                 # pl / ru / en
  geo: ""                  # страна выдачи
  niche: ""                # тематика в одну строку
  goal: ""                 # что должен делать посетитель: клик по офферу / заявка / чтение
  tone: ""                 # характер: экспертный / игровой / сдержанный

mode: normal               # normal | auto | interview

# ─── СТРУКТУРА ────────────────────────────────────────────────
structure:
  source: clusters         # landing | clusters | seo-pipeline
  input: ""                # путь к файлу семантики / экспорта пайплайна
  texts: false             # true — тексты приходят готовыми, их нельзя переписывать
  depth: 2                 # уровней вложенности URL
  page_types:              # если пусто — конвейер выведет сам из структуры
    - home
    - hub
    - entity
    - article

# ─── РЕФЕРЕНСЫ ────────────────────────────────────────────────
references:
  global:
    - url: ""
      likes: ""            # ЧТО ИМЕННО нравится — обязательно словами
      dislikes: ""         # что не брать
  blocks:
    - block: ""            # имя блока: bonus / hero / comparison-table ...
      page_type: ""        # на каком типе страниц он живёт
      url: ""              # референс
      likes: ""

# ─── БЛОКИ ПО ТИПАМ СТРАНИЦ ───────────────────────────────────
# Если раздел пуст — конвейер собирает карту блоков сам и пишет её в DECISIONS.md
blocks:
  home: []                 # hero, trust, offers, categories, faq, cta ...
  hub: []
  entity: []
  article: []

# ─── ДИЗАЙН ───────────────────────────────────────────────────
design:
  theme: ""                # dark | light | auto
  palette: ""              # словами или hex-акцент
  density: ""              # airy | balanced | dense
  motion: ""               # none | subtle | expressive
  must_have: []            # обязательные элементы
  forbidden: []            # чего не должно быть

# ─── SEO ──────────────────────────────────────────────────────
seo:
  title_pattern: ""        # "{h1} — {brand}"
  description_pattern: ""
  schema: []               # Article, FAQPage, BreadcrumbList, ItemList ...
  internal_links: ""       # правила перелинковки между кластерами
  notes: ""                # дополнительное ТЗ по сеошке

# ─── ДОПОЛНИТЕЛЬНОЕ ТЗ ────────────────────────────────────────
extra: |
  Свободный текст: ограничения, юридические требования,
  особенности ниши, всё что не влезло в поля выше.
